name: build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # let every matrix leg finish instead of cancelling the rest on the first
      # failure; this is what `continue-on-error` was reaching for, without also
      # making the job incapable of failing
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # [ubuntu-latest, macos-latest]

    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: checkout code repository
        uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.58.0
          frozen: true

      - name: emacs setup
        run: |
          pixi run emacs-setup

      - name: build zmq
        run: |
          pixi run zmq-build
