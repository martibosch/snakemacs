[workspace]
authors = ["Martí Bosch <marti.bosch@protonmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "snakemacs"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
emacs-setup = """
emacs -nw --batch --load early-init.el \
                --eval '(progn
                        (defvar url-show-status)
                        (let ((debug-on-error t)
                              (url-show-status nil)
                              (user-emacs-directory default-directory)
                              (user-init-file (expand-file-name "init.el"))
                              (load-path (delq default-directory load-path)))
                           (load-file user-init-file)
                           (run-hooks (quote after-init-hook))))'
"""
zmq-build = "cd straight/repos/emacs-zmq && make"

[dependencies]
emacs = ">=30.2,<31"
make = ">=4.4.1,<5"
cmake = ">=4.2.3,<5"
libtool = ">=2.5.4,<3"
autoconf = ">=2.72,<3"
automake = ">=1.17,<2"
pkg-config = ">=0.29.2,<0.30"
compilers = ">=1.11.0,<2"
jupyter = ">=1.1.1,<2"
pixi-kernel = ">=0.7.1,<0.8"
ipykernel = ">=7.2.0,<8"
snakefmt = ">=0.11.4,<0.12"
jupytext = ">=1.19.1,<2"
basedpyright = ">=1.39.8,<2"
# ACHTUNG: `reformatter` resolves ruff from $PATH (see the on-save hooks in main.el),
# so it has to be in the environment - not just installed globally.  same for `just`,
# which `justl-executable' and `just-executable' both look up by name
ruff = ">=0.16.3,<0.17"
just = ">=1.58,<2"

# the pdf toolchain both writing routes share: an engine, and pandoc for markdown ->
# pdf (see `my/markdown-export-pdf' in main.el, and `markdown-command' for the
# `C-c C-c p' html preview).  everything here is plain conda-forge
[feature.pdf.dependencies]
tectonic = ">=0.17,<0.18"
pandoc = ">=3.10.2,<4"

# biblatex's backend, needed only by the org and latex routes - pandoc resolves
# citations itself with `--citeproc', so the markdown route never calls biber and does
# not want the ~165 perl packages that come with it
# ACHTUNG: the extra channel is declared on the feature rather than on the workspace on
# purpose - adding it to `[workspace] channels' changes the channel set of *every*
# environment and forces a full re-resolve of the default one
[feature.biber]
channels = [{ channel = "dnachun", priority = -1 }]

[feature.biber.dependencies]
# ACHTUNG: tectonic carries its own texlive bundle but shells out to an *external*
# biber, and biber is strictly version-coupled to the biblatex it reads: the bundle of
# tectonic 0.17 ships biblatex 3.17, which only biber 2.17 understands.  the channel
# default (2.20) fails with "Found biblatex control file version 3.8, expected version
# 3.11", so bump this pin only together with the tectonic bundle.  biber is not on
# conda-forge (see https://github.com/plk/biber/issues/485), hence the dnachun channel,
# which is also where its ~60 perl dependencies come from
biber = { version = "==2.17", channel = "dnachun" }

# optional docs toolchain, built with `pixi run -e docs myst start`
# ACHTUNG: mystmd is the standalone MyST engine (no sphinx), which is why it drags in
# nodejs - confined to this environment, the default one stays node-free
[feature.docs.dependencies]
mystmd = ">=1.10.1,<2"

# named environments implicitly include the default feature, so each of these is the
# full snakemacs environment plus the features listed
[environments]
# markdown -> pdf: two extra conda-forge packages, no extra channel
md = ["pdf"]
# org and latex -> pdf: the above plus biber and its perl closure, off dnachun
tex = ["pdf", "biber"]
docs = ["docs"]
